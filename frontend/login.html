<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h2>Iniciar sesión</h2>
    <form id="loginForm">
    <label>Email:</label>
    <input type="email" id="email" required><br><br>
    <label>Password:</label>
    <input type="password" id="password" required><br><br>
    <button type="submit">Login</button>
    </form>

    <p id="message"></p>

    <script>
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('http://localhost:3000/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
            localStorage.setItem('token', data.token);
            document.getElementById('message').textContent = 'Login exitoso. Token guardado.';
        } else {
            document.getElementById('message').textContent = data.message || 'Error en login';
        }
        } catch (error) {
        document.getElementById('message').textContent = 'Error de conexión';
        }
    });
    </script>
</body>
</html>
