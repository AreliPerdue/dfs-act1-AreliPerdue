name: Node.js CI   # Label visible en GitHub Actions

on:
  push:            # Se ejecuta al hacer push
    branches: [ "main" ]
  pull_request:    # También en PR hacia main
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest   # GitHub usa una VM Linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Descarga tu repo en la VM

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20   # 👈 Usa Node.js 20 LTS

      - name: Install dependencies
        run: npm install
        working-directory: ./backend
        # Instala dependencias desde backend/package.json

      - name: Run tests
        run: npm test
        working-directory: ./backend
        # Corre tus pruebas Jest en backend
